name: Native iOS tests
on:
  push:
    paths: ['BMSport/**', 'BMSportTests/**', 'BMSportUITests/**', 'BMSport.xcodeproj/**', 'config/Native-Info.plist', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "SIMULATOR_ID=$id" >> "$GITHUB_ENV"
      - name: Build and test SwiftUI app
        run: |
          xcodebuild -project BMSport.xcodeproj -scheme BMSport -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath Build build-for-testing CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
          plutil -p Build/Build/Products/Debug-iphonesimulator/BMSport.app/Info.plist
          swift -e 'import Foundation; let b = Bundle(url: URL(fileURLWithPath: "Build/Build/Products/Debug-iphonesimulator/BMSport.app")); print("Foundation bundle:", b?.bundleIdentifier ?? "NIL"); print(b?.infoDictionary ?? [:])'
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcrun simctl install "$SIMULATOR_ID" Build/Build/Products/Debug-iphonesimulator/BMSport.app
          xcodebuild -project BMSport.xcodeproj -scheme BMSport -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath Build -parallel-testing-enabled NO -resultBundlePath TestResults test-without-building CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: TestResults.xcresult
